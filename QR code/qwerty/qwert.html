<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Color Boxes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="row text-white text-center">
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-primary">Primary</div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-secondary">Secondary</div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-danger">Danger</div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-warning text-dark">Warning</div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-info text-dark">Info</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
