<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Boxes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <div class="row">
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-primary text-white text-center">
          BEMBANGAN
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-secondary text-white text-center">
          Secondary Box
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-danger text-white text-center">
          Danger Box
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-warning text-dark text-center">
          Warning Box
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-info text-dark text-center">
          Info Box
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
